# Render Blueprint: https://render.com/docs/blueprint-spec
# One Node web service. Game state lives in memory, so keep it at a single instance.
services:
  - type: web
    name: cotogloom
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"

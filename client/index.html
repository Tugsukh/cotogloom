<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotogloom — Hide &amp; Seek</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <!-- Join screen -->
  <div id="join" class="screen">
    <div class="card">
      <h1>COTOGLOOM</h1>
      <p class="sub">a hide-and-seek game in the dark</p>
      <label>Your name <input id="nameInput" maxlength="16" placeholder="Name" autocomplete="off"></label>
      <div class="label">Pick a color</div>
      <div id="colorPicker" class="colors"></div>
      <button id="joinBtn" class="big">Join lobby</button>
      <div id="joinError" class="error"></div>
      <div id="joinInfo" class="muted"></div>
    </div>
  </div>

  <!-- Lobby panel -->
  <div id="lobby" class="screen hidden">
    <div class="card wide">
      <h2>Lobby <span id="lobbyCount" class="muted"></span></h2>
      <div class="lobbyGrid">
        <div>
          <ul id="playerList"></ul>
          <button id="readyBtn" class="big">Ready</button>
        </div>
        <div>
          <h3>Settings <span id="hostNote" class="muted"></span></h3>
          <label>Round length (min) <input id="setRound" type="number" min="1" max="20" step="0.5"></label>
          <label>Hiding time (s) <input id="setHide" type="number" min="5" max="120" step="5"></label>
          <label>Tasks to escape <input id="setTasks" type="number" min="1" max="10" step="1"></label>
          <label>Seeker <select id="setSeeker"></select></label>
          <button id="startBtn" class="big start">Start game</button>
          <div id="startHint" class="muted"></div>
        </div>
      </div>
      <div class="row">
        <button id="walkBtn">Walk around (click)</button>
        <span class="muted">WASD move · Mouse look · Shift sprint · C/Ctrl crouch · E use · Esc menu</span>
      </div>
    </div>
  </div>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="topbar">
      <span id="hudRole"></span>
      <span id="hudTimer"></span>
      <span id="hudTasks"></span>
      <span id="hudRemaining"></span>
    </div>
    <div id="stamina"><div id="staminaFill"></div></div>
    <div id="prompt" class="hidden"></div>
    <div id="alert" class="hidden"></div>
    <div id="toasts"></div>
    <div id="crouchIcon" class="hidden">CROUCHED</div>
  </div>

  <div id="blackout" class="hidden">
    <div class="bigText">You are the SEEKER</div>
    <div>The hiders are hiding. Count to…</div>
    <div id="blackoutTimer" class="count"></div>
  </div>

  <div id="pause" class="hidden"><div>Click to resume</div><div class="muted">Esc frees the mouse</div></div>

  <div id="spectate" class="hidden"></div>

  <!-- Task overlay -->
  <div id="task" class="hidden">
    <div class="taskBox">
      <div class="taskHead"><span id="taskTitle"></span><button id="taskClose" title="Esc">✕ Esc</button></div>
      <div id="taskBody"></div>
    </div>
  </div>

  <!-- End screen -->
  <div id="end" class="screen hidden">
    <div class="card wide">
      <h1 id="endTitle"></h1>
      <p id="endReason" class="sub"></p>
      <table id="endTable"></table>
      <div class="row">
        <button id="againBtn" class="big start">Play again</button>
        <button id="toLobbyBtn">Back to lobby</button>
        <span id="endWait" class="muted"></span>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
